id = "koyaa-plugins/dns-switcher-plus"
name = "DNS / DNSCrypt Switcher"
version = "0.1.2"
plugin_api = 17
author = "koyaa"
license = "MIT"
icon = "world"
description = "Quickly switch DNS providers or DNSCrypt mode in NetworkManager"
tags = ["bar", "panel", "service", "network", "launcher"]

[[setting]]
key = "poll_seconds"
type = "int"
label_key = "settings.poll_seconds.label"
description_key = "settings.poll_seconds.description"
default = 10

[[setting]]
key = "engine_mode"
type = "string"
label_key = "settings.engine_mode.label"
description_key = "settings.engine_mode.description"
default = "dnscrypt"

[[setting]]
key = "dnscrypt_config"
type = "string"
label_key = "settings.dnscrypt_config.label"
description_key = "settings.dnscrypt_config.description"
default = "/etc/dnscrypt-proxy/dnscrypt-proxy.toml"

[[setting]]
key = "dnscrypt_service"
type = "string"
label_key = "settings.dnscrypt_service.label"
description_key = "settings.dnscrypt_service.description"
default = "dnscrypt-proxy.service"

[[setting]]
key = "privilege_tool"
type = "string"
label_key = "settings.privilege_tool.label"
description_key = "settings.privilege_tool.description"
default = "pkexec"

[[setting]]
key = "color_non_default"
type = "bool"
label_key = "settings.color_non_default.label"
description_key = "settings.color_non_default.description"
default = true

[[setting]]
key = "active_color_role"
type = "string"
label_key = "settings.active_color_role.label"
description_key = "settings.active_color_role.description"
default = "primary"

[[service]]
id = "service"
entry = "service.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 430
height = 460
placement = "attached"
open_near_click = true

[[launcher_provider]]
id = "launcher"
entry = "launcher.luau"
prefix = "dns"
glyph = "world"
include_in_global_search = true

[[widget]]
id = "dnscrypt-switcher"
entry = "widget.luau"

  [widget.actions]
  left = "panel-toggle koyaa-plugins/dns-switcher-plus:panel"
  right = "plugin koyaa-plugins/dns-switcher-plus:service all apply default"

  [[widget.setting]]
  key = "show_label"
  type = "bool"
  label_key = "settings.show_label.label"
  description_key = "settings.show_label.description"
  default = true
